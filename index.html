<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#ffffff;
color:#242424;
line-height:1.6;
}

/* header */

header{
background:white;
border-bottom:1px solid #e6e6e6;
padding:20px 0;
position:fixed;
top:0;
width:100%;
}

header h1{
font-family:'Fraunces',serif;
text-align:center;
font-size:1.9rem;
font-weight:600;
}

/* layout */

main{
max-width:1100px;
margin:120px auto 60px auto;
padding:0 20px;
}

.layout{
display:grid;
grid-template-columns:3fr 1fr;
gap:40px;
}

/* reportagens */

#reports-container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
}

.report{
border:1px solid #ececec;
border-radius:6px;
overflow:hidden;
background:white;
transition:0.2s;
}

.report:hover{
transform:translateY(-3px);
box-shadow:0 5px 12px rgba(0,0,0,0.06);
}

.report img{
width:100%;
height:160px;
object-fit:cover;
}

.vehicle{
font-size:0.75rem;
color:#8a63ff;
font-weight:600;
padding:12px 12px 0 12px;
letter-spacing:0.4px;
text-transform:uppercase;
}

.report h3{
font-size:0.95rem;
padding:6px 12px 14px 12px;
font-weight:600;
}

.report a{
text-decoration:none;
color:#242424;
display:block;
}

.report a:hover{
color:#8a63ff;
}

/* bio */

.bio{
border:1px solid #ececec;
padding:22px;
border-radius:6px;
height:fit-content;
position:sticky;
top:120px;
}

.bio h2{
font-family:'Fraunces',serif;
font-size:1.4rem;
margin-bottom:15px;
}

.bio p{
font-size:0.95rem;
line-height:1.6;
margin-bottom:20px;
}

/* social icons bio */

.bio-icons{
display:flex;
gap:18px;
}

.bio-icons a{
color:#555;
font-size:1.3rem;
}

.bio-icons a:hover{
color:#8a63ff;
}

/* footer */

footer{
border-top:1px solid #e6e6e6;
padding:30px;
text-align:center;
color:#6b6b6b;
font-size:0.9rem;
margin-top:60px;
}

/* responsivo */

@media(max-width:900px){

.layout{
grid-template-columns:1fr;
}

.bio{
position:relative;
top:auto;
}

#reports-container{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

#reports-container{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>
