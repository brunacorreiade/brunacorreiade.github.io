<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#111;
color:white;
line-height:1.6;
}

/* header */

header{
padding:40px 20px;
border-bottom:1px solid #333;
}

header h1{
font-family:'Fraunces',serif;
font-size:2rem;
}

/* layout */

main{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.layout{
display:grid;
grid-template-columns:3fr 1fr;
gap:60px;
}

/* reportagens */

#reports-container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
}

.report{
background:#1a1a1a;
border-radius:6px;
overflow:hidden;
transition:0.2s;
}

.report:hover{
transform:translateY(-5px);
}

.report img{
width:100%;
height:170px;
object-fit:cover;
}

.vehicle{
font-size:0.75rem;
color:#aaa;
font-weight:600;
padding:12px 14px 0 14px;
text-transform:uppercase;
}

.report h3{
font-size:0.95rem;
padding:8px 14px 14px 14px;
}

.report a{
text-decoration:none;
color:white;
display:block;
}

/* bio */

.bio{
position:sticky;
top:40px;
}

.bio h2{
font-family:'Fraunces',serif;
margin-bottom:15px;
}

.bio p{
font-size:0.95rem;
margin-bottom:20px;
color:#ccc;
}

.bio-icons{
display:flex;
gap:15px;
}

.bio-icons a{
color:#aaa;
font-size:1.3rem;
}

.bio-icons a:hover{
color:white;
}

/* footer */

footer{
border-top:1px solid #333;
padding:30px;
text-align:center;
color:#777;
margin-top:60px;
}

/* responsivo */

@media(max-width:900px){

.layout{
grid-template-columns:1fr;
}

#reports-container{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

#reports-container{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

function renderReports(){

const container=document.getElementById("reports-container")

<img src="${report.image}">

</a>

})
