<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Seu Nome — Jornalista</title>
<meta name="description" content="Portfólio de jornalismo com reportagens publicadas em veículos como iG, Jornal da USP e outros.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
font-family:Inter, sans-serif;
background:#fafafa;
color:#333;
margin:0;
}

.container{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

/* HEADER */

header{
background:#f3f0ff;
border-bottom:1px solid #e4e4e4;
}

header h1{
font-family:Fraunces, serif;
font-size:2.4rem;
margin:0;
color:#2c2c2c;
}

header p{
margin-top:8px;
color:#555;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:24px;
margin-top:40px;
}

/* CARD */

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,0.06);
transition:0.2s;
}

.card:hover{
transform:translateY(-3px);
box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

/* VEÍCULO */

.vehicle{
display:inline-block;
background:#f3f0ff;
color:#7c5cff;
font-size:0.7rem;
padding:4px 8px;
margin:12px;
border-radius:4px;
font-weight:500;
letter-spacing:0.3px;
}

/* TÍTULO */

.card h3{
font-family:Fraunces, serif;
font-size:1.05rem;
line-height:1.4;
padding:0 12px 16px 12px;
margin:0;
}

/* SOBRE */

.about{
display:grid;
grid-template-columns:1fr 280px;
gap:40px;
margin-top:60px;
}

.bio{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.bio h2{
font-family:Fraunces;
margin-top:0;
}

/* SOCIAL */

.social{
margin-top:16px;
display:flex;
gap:14px;
}

.social a{
text-decoration:none;
font-size:1.4rem;
}

/* FOOTER */

footer{
margin-top:80px;
padding:30px;
text-align:center;
font-size:0.9rem;
color:#777;
border-top:1px solid #e4e4e4;
}

</style>
</head>


<body>

<header>
<div class="container">
<h1>Seu Nome</h1>
<p>Jornalista</p>
</div>
</header>


<div class="container">

<div class="grid" id="reports"></div>


<div class="about">

<div class="bio">

<h2>Sobre mim</h2>

<p>
Jornalista com experiência em reportagem, análise política e produção de conteúdo.
</p>

<p>
Já publiquei em veículos como iG, Jornal da USP e outros.
</p>

<div class="social">

<a href="#">🐙</a>
<a href="#">📸</a>
<a href="#">💼</a>

</div>

</div>

</div>

</div>


<footer>
© 2026 — Seu Nome
</footer>



<script>

const reports=[

{
title:"Alckmin aposta em memes e linguagem jovem para aumentar popularidade",
vehicle:"iG",
image:"https://picsum.photos/500/300",
link:"#"
},

{
title:"Conferências do USP Pensa Brasil atraem público das cinco regiões",
vehicle:"Jornal da USP",
image:"https://picsum.photos/500/301",
link:"#"
},

{
title:"Reforma tributária: entenda por que mudança é histórica",
vehicle:"iG Economia",
image:"https://picsum.photos/500/302",
link:"#"
}

];


const container=document.getElementById("reports");


reports.forEach(report=>{

const div=document.createElement("div");

div.className="card";

div.innerHTML=`

<a href="${report.link}" target="_blank">

<img loading="lazy" src="${report.image}" alt="${report.title}">

<div class="vehicle">${report.vehicle}</div>

<h3>${report.title}</h3>

</a>

`;

container.appendChild(div);

});

</script>

</body>
</html>
